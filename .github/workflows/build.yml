name: Build Android APK and AAB

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build debug APK
        run: eas build --local --platform android --profile debug --non-interactive --output ./build/opendroneweather-debug.apk
        env:
          EAS_NO_VCS: 1
          EXPO_NO_TELEMETRY: 1

      - name: Set up signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android-keystore.jks
          node -e "
            const fs = require('fs');
            fs.writeFileSync('credentials.json', JSON.stringify({
              android: {
                keystore: {
                  keystorePath: './android-keystore.jks',
                  keystorePassword: process.env.KEYSTORE_PASSWORD,
                  keyAlias: process.env.KEY_ALIAS,
                  keyPassword: process.env.KEY_PASSWORD,
                }
              }
            }, null, 2));
          "

      - name: Build production AAB
        run: eas build --local --platform android --profile production --non-interactive --output ./build/opendroneweather-production.aab
        env:
          EAS_NO_VCS: 1
          EXPO_NO_TELEMETRY: 1

      - name: Clean up signing credentials
        if: always()
        run: rm -f android-keystore.jks credentials.json

      - name: Sanitize ref name
        id: sanitize
        run: echo "ref=$(echo '${{ github.ref_name }}' | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opendroneweather-${{ steps.sanitize.outputs.ref }}-${{ github.run_number }}
          path: build/
          retention-days: 15

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: build/*
          draft: false
          prerelease: false
